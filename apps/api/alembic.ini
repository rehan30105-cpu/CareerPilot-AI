[alembic]
# path to migration scripts
script_location = alembic

# database URL (overridden by app settings at runtime)
sqlalchemy.url = postgresql+asyncpg://careerpilot:careerpilot@localhost:5432/careerpilot

# version location
version_locations = alembic/versions

# timezone to use when printing the date within the migration file
timezone = utc

# max length of characters to apply to the version file name
max_version_length = 64

# version file separator
version_file_separator = _

# whether to use a version table
version_table = alembic_version

# logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = ()
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
